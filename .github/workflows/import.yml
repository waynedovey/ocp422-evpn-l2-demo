name: Import verified EVPN lab source
on:
  push:
    paths: ['.seed/READY']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and commit source
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib
          parts=sorted(pathlib.Path('.seed').glob('part*.txt'))
          assert len(parts)==6, f'Expected 6 parts, got {len(parts)}'
          encoded=''.join(p.read_text().strip() for p in parts)
          assert hashlib.sha256(encoded.encode()).hexdigest()=='41813c4a5d37fd9e417054c9092105dd15a77a6059408cb6abc70666228a4c42'
          data=json.loads(lzma.decompress(base64.b64decode(encoded)))
          assert len(data['files'])==50
          for item in data['files']:
              path=pathlib.PurePosixPath(item['path'])
              assert not path.is_absolute() and '..' not in path.parts
              dest=pathlib.Path(*path.parts)
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_text(item['content'])
          PY
          rm -rf .seed .github/workflows/import.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Publish verified two-site OpenShift 4.22 EVPN lab"
          git push origin HEAD:main
