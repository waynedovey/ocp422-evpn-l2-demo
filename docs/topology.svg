<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="915" viewBox="0 0 1600 915" role="img" aria-labelledby="title desc">
<title id="title">OpenShift 4.22 Cross-Cluster EVPN L2 Lab Topology</title><desc id="desc">Site A cluster kcp74 and Site B cluster 9r9gz, seven OpenShift nodes each, a demonstration VM on each, local eBGP peering to FRR bastions, iBGP over an encrypted SSH TUN underlay, and a Layer 2 EVPN VXLAN overlay between the VTEPs.</desc>
