<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="960" viewBox="0 0 1680 960" role="img" aria-labelledby="title desc">
<title id="title">OpenShift 4.22 Cross-Cluster EVPN L2 Lab Topology</title>
<desc id="desc">Two OpenShift 4.22 clusters with seven nodes each. Site A VM at 10.250.50.3 and VTEP 10.251.10.15 communicates with Site B VM at 10.250.50.4 and VTEP 10.251.20.24 over EVPN VXLAN. Each cluster peers with its local FRR bastion using eBGP. The bastions peer using iBGP across encrypted SSH tun7.</desc>
